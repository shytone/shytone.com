# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

## !USE TEXT THEME
theme: jekyll-text-theme

## => Site Settings
##############################
text_skin: dark
highlight_theme: tomorrow-night
url     : https://shytone.com
baseurl : 
title   : SHYTONE.COM
description: >
  Personal blog · 技术分享 · 学习记录

## => Language and Timezone
##############################
lang: zh-Hans
timezone: Asia/Shanghai

## => Author and Social
##############################
author:
  type      : person
  name      : shytone
  url       : https://shytone.com
  bio       : Developer · Learner · Builder
  email     :
  github    : shytone
  weibo     :

## => GitHub Repository
##############################
repository: shytone/shytone.com
repository_tree: main

## => Paths
##############################
paths:
  root    : /
  home    : /
  archive : /archive.html
  rss     : /feed.xml

## => Post
##############################
excerpt_separator: <!--more-->

## => Markdown Enhancements
##############################
mathjax: true
mathjax_autoNumber: true

## => Paginate
##############################
paginate: 10
paginate_path: /page:num

## => Sources
##############################
sources: bootcdn

## => Sharing
##############################
sharing:
  provider: false

## => Comments
##############################
comments:
  provider: false

## => Pageview
##############################
pageview:
  provider: false

## => Search
##############################
search:
  provider: false

## => Analytics
##############################
analytics:
  provider: false

## => Build
##############################
markdown    : kramdown
highlighter : rouge
permalink   : date

exclude:
  - CHANGELOG.md
  - HOW_TO_RELEASE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README-*.md
  - README.md
  - gulpfile.js
  - jekyll-text-theme.gemspec
  - package-lock.json
  - package.json
  - /docs
  - /node_modules
  - /screenshots
  - /test
  - /vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      license: true
      show_edit_on_github: false
      show_subscribe: false
      pageview: false
      mathjax: true

## => Collections
##############################
collections:
  ai-daily:
    output: true
    permalink: /ai-daily/:path/

## => Plugins
##############################
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji
