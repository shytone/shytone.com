<article><div class="meta">方法 · 2026-08-17</div><h2>给 AI 一份可验收的规格</h2><p class="lede">验收标准是每次生成前的「刹车」。规格质量决定代码质量。</p><p>生成之前，先写清需求与<strong>可测的验收标准</strong>，明确输入输出、边界与错误行为。</p>
<p>把「前置一次性 PRD」变成「每轮对话的实时输入」：意图一旦错了，会污染所有后续生成。</p>
<p>可落地：用「AI 任务规格」模板写契约，用「AI 代码评审清单」逐项核对，形成闭环。</p></article>
