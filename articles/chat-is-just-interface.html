<article><div class="meta">认知 · 2026-08-17</div><h2>聊天只是界面</h2><p class="lede">聊天窗口只是界面；界面会越来越廉价，而界面背后的「意图与上下文」会越来越值钱。</p><p>聊天 / 指令是一种界面，就像命令行之于图形界面。界面形态持续廉价化、隐形化。</p>
<p>区分三层：<strong>措辞层</strong>（字斟句酌防走样）现状重要、未来大幅弱化；<strong>上下文层</strong>（给哪些信息、多细）未来更重要；<strong>意图层</strong>（想要什么 + 如何定义成功）永不弱化。</p>
<p>别练「prompt 措辞」，练三件不贬值的事：</p>
<ul><li>把需求想清楚</li><li>定义可验证的成功标准</li><li>给对上下文</li></ul></article>
